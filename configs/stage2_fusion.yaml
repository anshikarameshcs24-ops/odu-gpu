run_name: "stage2_fusion_v1"
seed: 42

vision_ckpt: "MCG-NJU/videomae-base-finetuned-kinetics"
audio_ckpt: "facebook/wav2vec2-large-robust"
output_dir: "checkpoints/stage2"

train_csv: "data/annotations/train.csv"
val_csv: "data/annotations/val.csv"
manifest_csv: "data/processed/chunks_manifest.csv"

num_epochs: 30
batch_size: 2
num_workers: 8
vision_backbone_lr: 2.0e-5
audio_backbone_lr: 5.0e-6
fusion_lr: 1.0e-4
head_lr: 1.0e-4
weight_decay: 0.01
max_grad_norm: 1.0
unfreeze_epoch: 3
accumulation_steps: 4
enable_gradient_checkpointing: true
modality_dropout_prob: 0.15
num_patch_tokens: 8
num_audio_tokens: 8
use_wandb: false
log_every: 10
