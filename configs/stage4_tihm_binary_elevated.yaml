run_name: "stage4_tihm_binary_elevated"
seed: 42
output_dir: "checkpoints/stage4_tihm_binary_elevated"

train_sequences: "data/processed/tihm_binary/train_sequences.json"
val_sequences: "data/processed/tihm_binary/val_sequences.json"
test_sequences: "data/processed/tihm_binary/test_sequences.json"
events_json: "data/processed/tihm_binary/events.json"

num_epochs: 8
batch_size: 2048
eval_batch_size: 4096
num_workers: 8
pin_memory: true
persistent_workers: true
prefetch_factor: 4
cache_dataset_in_memory: true
pack_dataset_arrays: true
packed_arrays_dir: "data/processed/tihm_binary/packed"
use_mixed_precision: true
cudnn_benchmark: true
eval_every_n_epochs: 2
lr: 1.0e-4
weight_decay: 0.01
max_grad_norm: 1.0
hidden_dim: 256
projection_dim: 256
dropout: 0.2
minority_target_fraction: 0.1
max_pos_weight: 256.0
threshold_min_sensitivity: 0.5
threshold_min_specificity: 0.8
early_stop_patience: 2
use_wandb: false
log_every: 100
progress_every_batches: 100
